{% extends "base.html" %}
{% block title %}Anmelden – Vorrat{% endblock %}
{% block content %}
<section class="login">
  <h1>Vorrat</h1>
  <form method="post" class="stack">
    <label for="name">Benutzername</label>
    <input id="name" name="name" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="pw">Passwort</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Anmelden</button>
  </form>
  <p class="sub">Neu hier? <a href="{{ url_for('register') }}">Konto anlegen</a> – mit eigenem Vorratsschrank oder per Beitrittscode in einen bestehenden.</p>
</section>
{% endblock %}
