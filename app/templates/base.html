<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F4E79">
  <title>{% block title %}Vorrat{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
</head>
<body>
  <main class="page">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash" role="status">
          {% for m in messages %}<p>{{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% if nav != 'login' %}
  <nav class="tabs" aria-label="Hauptnavigation">
    <a href="{{ url_for('index') }}" {% if nav == 'index' %}aria-current="page"{% endif %}>Heute</a>
    <a href="{{ url_for('plan_view') }}" {% if nav == 'plan_view' %}aria-current="page"{% endif %}>Plan</a>
    <a href="{{ url_for('shopping') }}" {% if nav == 'shopping' %}aria-current="page"{% endif %}>Einkauf</a>
    <a href="{{ url_for('stock') }}" {% if nav == 'stock' %}aria-current="page"{% endif %}>Vorrat</a>
    <a href="{{ url_for('recipes') }}" {% if nav == 'recipes' %}aria-current="page"{% endif %}>Rezepte</a>
  </nav>
  {% endif %}
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () {});
</script>
</body>
</html>
